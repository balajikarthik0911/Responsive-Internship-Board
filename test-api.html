<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship API Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5f5f5;
    }

    h1 {
      color: #222;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 22px;
      margin: 10px 10px 10px 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #0056b3;
    }

    #result {
      margin-top: 25px;
      padding: 25px;
      background: #111;
      color: #00ff00;
      min-height: 200px;
      border-radius: 8px;
      font-family: Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>Internship API Test</h1>

  <button onclick="getInternships()">
    Get Internships
  </button>

  <button onclick="getApplications()">
    Get Applications
  </button>

  <div id="result">Click a button to test the API.</div>


  <script>

    // GET INTERNSHIPS
    async function getInternships() {

      const result = document.getElementById("result");

      result.textContent = "Loading internships...";

      try {

        const response = await fetch("/api/internships");

        if (!response.ok) {
          throw new Error(
            "HTTP Error: " + response.status
          );
        }

        const data = await response.json();

        result.textContent =
          "SUCCESS\n\n" +
          JSON.stringify(data, null, 2);

      } catch (error) {

        result.textContent =
          "ERROR\n\n" +
          error.message;

      }
    }


    // GET APPLICATIONS
    async function getApplications() {

      const result = document.getElementById("result");

      result.textContent = "Loading applications...";

      try {

        const response = await fetch("/api/applications");

        if (!response.ok) {
          throw new Error(
            "HTTP Error: " + response.status
          );
        }

        const data = await response.json();

        result.textContent =
          "SUCCESS\n\n" +
          JSON.stringify(data, null, 2);

      } catch (error) {

        result.textContent =
          "ERROR\n\n" +
          error.message;

      }
    }

  </script>

</body>
</html>
