<!DOCTYPE html>
<html>
<head>
    <title>Internship Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Internship Board</h1>
    <p>Find your next internship opportunity</p>
</header>

<main>

    <input
        type="text"
        id="search"
        placeholder="Search internships..."
    >

 <section id="applicationSection">

    <h2>Apply for an Internship</h2>

    <form id="applicationForm">

        <label for="applicantName">Name</label>
        <input
            type="text"
            id="applicantName"
            required
            minlength="2"
            maxlength="50"
        >

        <label for="applicantEmail">Email</label>
        <input
            type="email"
            id="applicantEmail"
            required
        >

        <label for="applicantPhone">Phone</label>
        <input
            type="tel"
            id="applicantPhone"
            required
            pattern="[0-9]{10}"
        >

        <label for="internshipId">Internship ID</label>
        <input
            type="number"
            id="internshipId"
            required
            min="1"
        >

        <button type="submit">
            Submit Application
        </button>

        <p id="applicationMessage"></p>

    </form>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
